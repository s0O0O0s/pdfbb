<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #313338;
      color: #dbdee1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #2b2d31;
      padding: 12px 20px;
      border-bottom: 1px solid #1e1f22;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .header-title {
      font-weight: bold;
      font-size: 1.1rem;
      color: #f2f3f5;
    }
    select {
      background-color: #1e1f22;
      color: #f2f3f5;
      border: 1px solid #383a40;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      display: flex;
      gap: 12px;
      line-height: 1.4;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      flex-shrink: 0;
      overflow: hidden;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .message-content {
      display: flex;
      flex-direction: column;
    }
    .message-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .username {
      font-weight: 600;
      color: #f2f3f5;
      font-size: 0.95rem;
    }
    .bot-badge {
      background-color: #5865f2;
      color: white;
      font-size: 0.65rem;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: bold;
    }
    .timestamp {
      font-size: 0.75rem;
      color: #949ba4;
    }
    .text {
      color: #dbdee1;
      font-size: 0.95rem;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .input-container {
      padding: 16px 20px;
      background-color: #313338;
    }
    .input-form {
      display: flex;
      background-color: #383a40;
      border-radius: 8px;
      padding: 4px 8px 4px 16px;
      align-items: center;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f2f3f5;
      font-size: 1rem;
      padding: 10px 0;
    }
    input[type="text"]::placeholder {
      color: #80848e;
    }
    button {
      background-color: #5865f2;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #4752c4;
    }
    button:disabled {
      background-color: #4e5058;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">💬 Discord Chat</div>
    <select id="channelSelect" onchange="switchChannel()"></select>
  </header>
  
  <div id="chat-box"></div>

  <div class="input-container">
    <form class="input-form" id="chatForm" onsubmit="event.preventDefault(); send();">
      <input type="text" id="messageInput" placeholder="メッセージを入力" autocomplete="off">
      <button type="submit" id="sendBtn">送信</button>
    </form>
  </div>

  <script>
    let currentChannelId = null;
    let pollInterval = null;

    // 初期化：チャンネル一覧を取得
    async function init() {
      try {
        const res = await fetch("/api/channels");
        const channels = await res.json();
        
        const select = document.getElementById("channelSelect");
        if (Array.isArray(channels) && channels.length > 0) {
          select.innerHTML = channels.map(c => 
            `<option value="${c.id}"># ${escapeHtml(c.name)}</option>`
          ).join("");
          
          currentChannelId = channels[0].id;
          loadMessages();
          
          // 定期更新の開始
          if (pollInterval) clearInterval(pollInterval);
          pollInterval = setInterval(loadMessages, 3000);
        } else {
          select.innerHTML = `<option>チャンネルが見つかりません</option>`;
        }
      } catch (err) {
        console.error("チャンネル一覧取得エラー:", err);
      }
    }

    // チャンネル切り替え処理
    function switchChannel() {
      const select = document.getElementById("channelSelect");
      currentChannelId = select.value;
      loadMessages();
    }

    // メッセージ送信処理
    async function send() {
      if (!currentChannelId) return;

      const input = document.getElementById("messageInput");
      const btn = document.getElementById("sendBtn");
      const text = input.value.trim();
      
      if (!text) return;

      input.disabled = true;
      btn.disabled = true;

      try {
        await fetch(`/api/channels/${currentChannelId}/messages`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: text })
        });
        input.value = "";
        await loadMessages();
      } catch (err) {
        console.error("送信エラー:", err);
      } finally {
        input.disabled = false;
        btn.disabled = false;
        input.focus();
      }
    }

    // メッセージ取得処理
    async function loadMessages() {
      if (!currentChannelId) return;

      try {
        const res = await fetch(`/api/channels/${currentChannelId}/messages`);
        const messages = await res.json();
        
        const chatBox = document.getElementById("chat-box");
        if (Array.isArray(messages)) {
          chatBox.innerHTML = messages.slice().reverse().map(m => {
            const avatarUrl = m.author.avatar 
              ? `https://cdn.discordapp.com/avatars/${m.author.id}/${m.author.avatar}.png`
              : null;
            
            const initial = m.author.username ? m.author.username[0].toUpperCase() : '?';
            const isBot = m.author.bot;
            const date = new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            return `
              <div class="message">
                <div class="avatar">
                  ${avatarUrl ? `<img src="${avatarUrl}" alt="avatar">` : initial}
                </div>
                <div class="message-content">
                  <div class="message-header">
                    <span class="username">${escapeHtml(m.author.username)}</span>
                    ${isBot ? '<span class="bot-badge">BOT</span>' : ''}
                    <span class="timestamp">${date}</span>
                  </div>
                  <div class="text">${escapeHtml(m.content)}</div>
                </div>
              </div>
            `;
          }).join("");

          chatBox.scrollTop = chatBox.scrollHeight;
        }
      } catch (err) {
        console.error("取得エラー:", err);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Web Client</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              discord: {
                bg: '#313338',
                sidebar: '#2b2d31',
                servers: '#1e1f22',
                input: '#383a40',
                hover: '#35373c',
                active: '#404249',
                blurple: '#5865f2',
                blurpleHover: '#4752c4',
                green: '#23a55a',
                yellow: '#f0b232',
                red: '#f23f43',
                text: '#dbdee1',
                muted: '#949ba4',
                header: '#313338'
              }
            }
          }
        }
      }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      /* Custom Discord Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #2b2d31;
      }
      ::-webkit-scrollbar-thumb {
        background: #1a1b1e;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #111214;
      }
      
      /* Markdown Styling */
      .markdown-body pre {
        background-color: #1e1f22;
        border-radius: 6px;
        padding: 10px;
        margin-top: 6px;
        margin-bottom: 6px;
        overflow-x: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        border: 1px solid #202225;
      }
      .markdown-body code {
        background-color: #1e1f22;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.875rem;
      }
    </style>
</head>
<body class="bg-discord-bg text-discord-text h-full font-sans antialiased flex flex-col overflow-hidden select-none">

    <!-- Status Banner Header -->
    <div id="statusBanner" class="bg-discord-yellow/10 border-b border-discord-yellow/20 px-4 py-2 text-xs text-discord-yellow flex justify-between items-center transition-all">
        <div class="flex items-center gap-2">
            <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-discord-yellow animate-pulse"></span>
            <span id="statusText">環境変数を確認中...</span>
        </div>
        <div class="text-[11px] text-discord-muted font-mono" id="syncTimeLabel">最終同期: --:--:--</div>
    </div>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-discord-sidebar flex flex-col border-r border-[#202225]/40 flex-shrink-0 hidden md:flex">
            <!-- App Title Bar -->
            <div class="h-12 border-b border-[#202225]/60 flex items-center px-4 font-bold text-white shadow-sm gap-2">
                <i class="fa-brands fa-discord text-discord-blurple text-xl"></i>
                <span class="truncate">Discord Web Client</span>
            </div>

            <!-- Channel Item -->
            <div class="flex-1 overflow-y-auto p-2 space-y-1">
                <div class="text-xs font-semibold text-discord-muted uppercase px-2 py-1 tracking-wider">テキストチャンネル</div>
                <div class="flex items-center gap-2 px-2 py-1.5 rounded text-white bg-discord-active cursor-default">
                    <i class="fa-solid fa-hashtag text-discord-muted"></i>
                    <span id="sidebarChannelName" class="font-medium text-sm truncate">channel</span>
                </div>
            </div>

            <!-- Bot Connection Status Card -->
            <div class="bg-[#232428] p-2.5 flex items-center gap-3 border-t border-[#202225]/50">
                <div class="relative flex-shrink-0">
                    <div class="w-9 h-9 rounded-full bg-discord-blurple flex items-center justify-center font-bold text-white text-xs">
                        BOT
                    </div>
                    <span id="botOnlineIndicator" class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-discord-muted rounded-full border-2 border-[#232428]"></span>
                </div>
                <div class="flex flex-col overflow-hidden">
                    <span class="text-xs font-semibold text-white truncate">Discord API Link</span>
                    <span id="botStatusSubtext" class="text-[10px] text-discord-muted truncate">環境変数読み込み中</span>
                </div>
            </div>
        </aside>

        <!-- Main Chat Panel -->
        <main class="flex-1 flex flex-col bg-discord-bg relative overflow-hidden">
            <!-- Channel Header Bar -->
            <header class="h-12 border-b border-[#202225]/60 flex items-center justify-between px-4 bg-discord-header z-10 shadow-sm">
                <div class="flex items-center gap-2 overflow-hidden">
                    <button onclick="toggleMobileSidebar()" class="md:hidden text-discord-muted hover:text-white mr-1">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <i class="fa-solid fa-hashtag text-discord-muted text-xl"></i>
                    <span id="headerChannelName" class="font-bold text-white truncate">channel</span>
                    <span class="text-xs text-discord-muted border-l border-discord-muted/30 pl-3 ml-2 hidden sm:inline truncate">
                        リアルタイム REST API ポーリング同期
                    </span>
                </div>
                
                <div class="flex items-center gap-3 text-discord-muted flex-shrink-0">
                    <button onclick="manualRefresh()" class="hover:text-white transition-colors p-1" title="手動で最新ログを取得">
                        <i id="refreshIcon" class="fa-solid fa-rotate-right"></i>
                    </button>
                    <button onclick="clearChatView()" class="hover:text-white transition-colors p-1" title="画面ログの消去">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </header>

            <!-- Message Scroll Stream -->
            <div id="messageContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Welcome Banner -->
                <div class="border-b border-discord-muted/10 pb-4 mb-4">
                    <div class="w-16 h-16 rounded-full bg-discord-active flex items-center justify-center text-3xl text-white mb-2">
                        <i class="fa-solid fa-hashtag"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-white">#<span id="welcomeChannelName">channel</span> へようこそ！</h1>
                    <p class="text-discord-muted text-sm mt-1">ここがチャンネルのログビューアー＆送信インターフェースです。</p>
                </div>

                <!-- Active Message List -->
                <div id="messagesList" class="space-y-4"></div>
            </div>

            <!-- Input Area -->
            <div class="p-4 pt-0">
                <form id="chatForm" onsubmit="handleSendMessage(event)" class="bg-discord-input rounded-lg p-2.5 flex items-end gap-2 focus-within:ring-1 focus-within:ring-discord-blurple">
                    <button type="button" class="text-discord-muted hover:text-white p-1 text-lg rounded transition-colors flex-shrink-0 cursor-not-allowed" disabled>
                        <i class="fa-solid fa-circle-plus"></i>
                    </button>
                    <textarea 
                        id="messageInput" 
                        rows="1"
                        placeholder="メッセージを入力..." 
                        class="bg-transparent text-discord-text focus:outline-none w-full resize-none max-h-32 text-sm leading-relaxed py-1"
                        onkeydown="handleKeyDown(event)"></textarea>
                    <button type="submit" id="sendBtn" class="bg-discord-blurple hover:bg-discord-blurpleHover text-white px-3 py-1.5 rounded font-medium text-sm transition-colors flex items-center gap-1.5 flex-shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">
                        <span>送信</span>
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </form>
                <div class="flex justify-between items-center text-[11px] text-discord-muted mt-1.5 px-1">
                    <span><strong>Enter</strong> で送信 / <strong>Shift + Enter</strong> で改行</span>
                    <span id="pollStatusNotice">3秒間隔で自動同期中</span>
                </div>
            </div>
        </main>
    </div>

    <!-- Notification Toast Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
      /**
       * 環境変数の安全な取得 (UI非表示・編集不可)
       * window.ENV または process.env から読み込みを行います。
       */
      const ENV = {
        BOT_TOKEN: (typeof window !== 'undefined' && window.ENV && window.ENV.BOT_TOKEN) || 
                   (typeof process !== 'undefined' && process.env && process.env.DISCORD_BOT_TOKEN) || '',
        CHANNEL_ID: (typeof window !== 'undefined' && window.ENV && window.ENV.CHANNEL_ID) || 
                    (typeof process !== 'undefined' && process.env && process.env.DISCORD_CHANNEL_ID) || ''
      };

      // Application State
      const state = {
        botToken: ENV.BOT_TOKEN.trim(),
        channelId: ENV.CHANNEL_ID.trim(),
        isFetching: false,
        isSending: false,
        pollingTimer: null,
        pollingIntervalMs: 3000
      };

      // Lightweight Markdown Parser
      function renderMarkdown(text) {
        if (!text) return '';
        let html = text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');

        // Code blocks ```code```
        html = html.replace(/```([\s\S]*?)```/g, (match, code) => {
          return `<pre><code>${code.trim()}</code></pre>`;
        });

        // Inline code `code`
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

        // Bold **text**
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

        // Italic *text* or _text_
        html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        html = html.replace(/_([^_]+)_/g, '<em>$1</em>');

        // Autolink URLs
        const urlRegex = /(https?:\/\/[^\s<]+)/g;
        html = html.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener noreferrer" class="text-discord-blurple hover:underline break-all">$1</a>');

        // New lines
        return html.replace(/\n/g, '<br>');
      }

      // Toast Notification System
      function showToast(message, type = 'info') {
        const toastContainer = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        
        let borderStyle = 'border-discord-blurple';
        let icon = 'fa-circle-info text-discord-blurple';
        
        if (type === 'success') {
          borderStyle = 'border-discord-green';
          icon = 'fa-circle-check text-discord-green';
        } else if (type === 'error') {
          borderStyle = 'border-discord-red';
          icon = 'fa-circle-exclamation text-discord-red';
        }

        toast.className = `pointer-events-auto border-l-4 ${borderStyle} bg-discord-sidebar text-white px-4 py-3 rounded-r shadow-2xl flex items-center gap-3 text-sm transition-all transform translate-y-2 opacity-0 max-w-md`;
        toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span>${message}</span>`;

        toastContainer.appendChild(toast);

        requestAnimationFrame(() => {
          toast.classList.remove('translate-y-2', 'opacity-0');
        });

        setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => toast.remove(), 300);
        }, 4000);
      }

      // Application Lifecycle Initialization
      window.onload = function() {
        initApp();
      };

      function initApp() {
        const statusBanner = document.getElementById('statusBanner');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const botOnlineIndicator = document.getElementById('botOnlineIndicator');
        const botStatusSubtext = document.getElementById('botStatusSubtext');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // Validate Environment Variables
        if (!state.botToken || !state.channelId) {
          statusBanner.className = 'bg-discord-red/10 border-b border-discord-red/20 px-4 py-2 text-xs text-discord-red flex justify-between items-center';
          statusDot.className = 'w-2.5 h-2.5 rounded-full bg-discord-red';
          statusText.innerText = '環境変数 (window.ENV) が未設定です。Bot Token または Channel ID が読み込めません。';
          
          botOnlineIndicator.className = 'absolute bottom-0 right-0 w-2.5 h-2.5 bg-discord-red rounded-full border-2 border-[#232428]';
          botStatusSubtext.innerText = '未接続 (環境変数不足)';

          messageInput.disabled = true;
          messageInput.placeholder = '環境変数が設定されていません...';
          sendBtn.disabled = true;

          showToast('環境変数 (window.ENV) が設定されていません', 'error');
          return;
        }

        // Environment variables exist
        statusBanner.className = 'bg-discord-green/10 border-b border-discord-green/20 px-4 py-2 text-xs text-discord-green flex justify-between items-center';
        statusDot.className = 'w-2.5 h-2.5 rounded-full bg-discord-green animate-pulse';
        statusText.innerText = `Discord API 接続中 (Channel ID: ${state.channelId.substring(0, 6)}...)`;

        botOnlineIndicator.className = 'absolute bottom-0 right-0 w-2.5 h-2.5 bg-discord-green rounded-full border-2 border-[#232428]';
        botStatusSubtext.innerText = 'API オンライン';

        // Channel Labels
        document.getElementById('sidebarChannelName').innerText = state.channelId;
        document.getElementById('headerChannelName').innerText = state.channelId;
        document.getElementById('welcomeChannelName').innerText = state.channelId;

        // Fetch initial messages & start polling
        fetchMessages(true);
        startPolling();
      }

      // Fetch Messages from Discord REST API
      async function fetchMessages(forceScroll = false) {
        if (state.isFetching || !state.botToken || !state.channelId) return;

        state.isFetching = true;
        const refreshIcon = document.getElementById('refreshIcon');
        refreshIcon.classList.add('fa-spin');

        try {
          const response = await fetch(`https://discord.com/api/v10/channels/${state.channelId}/messages?limit=50`, {
            method: 'GET',
            headers: {
              'Authorization': `Bot ${state.botToken}`,
              'Content-Type': 'application/json'
            }
          });

          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.message || `HTTP ${response.status}`);
          }

          const data = await response.json();
          // API returns latest first, reverse to chronological order
          const formatted = data.reverse().map(msg => ({
            id: msg.id,
            author: {
              username: msg.author.username,
              bot: msg.author.bot || false,
              avatar: msg.author.avatar ? `https://cdn.discordapp.com/avatars/${msg.author.id}/${msg.author.avatar}.png` : null
            },
            content: msg.content,
            timestamp: new Date(msg.timestamp).toLocaleString('ja-JP'),
            attachments: msg.attachments || []
          }));

          renderMessages(formatted, forceScroll);
          document.getElementById('syncTimeLabel').innerText = `最終同期: ${new Date().toLocaleTimeString('ja-JP')}`;
        } catch (err) {
          console.error('Fetch Messages Error:', err);
          showToast(`通信エラー: ${err.message}`, 'error');
        } finally {
          state.isFetching = false;
          refreshIcon.classList.remove('fa-spin');
        }
      }

      // Render Messages
      function renderMessages(messages, forceScroll = false) {
        const listContainer = document.getElementById('messagesList');
        const container = document.getElementById('messageContainer');
        const isNearBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 120;

        listContainer.innerHTML = '';

        messages.forEach(msg => {
          const item = document.createElement('div');
          item.className = 'flex items-start gap-3 hover:bg-[#2e3035] -mx-4 px-4 py-1 rounded transition-colors group';

          // Avatar Image or Fallback
          let avatarHtml = `<div class="w-10 h-10 rounded-full bg-discord-blurple flex items-center justify-center font-bold text-white text-sm flex-shrink-0 mt-0.5">
            ${msg.author.username.charAt(0).toUpperCase()}
          </div>`;

          if (msg.author.avatar) {
            avatarHtml = `<img src="${msg.author.avatar}" alt="Avatar" class="w-10 h-10 rounded-full flex-shrink-0 mt-0.5 object-cover" onerror="this.onerror=null; this.src='https://placehold.co/40x40/5865f2/ffffff?text=U';">`;
          }

          // Bot Tag
          const botBadge = msg.author.bot 
            ? `<span class="bg-discord-blurple text-white text-[10px] px-1 rounded font-bold uppercase ml-1.5 flex items-center h-4 align-middle"><i class="fa-solid fa-check text-[8px] mr-0.5"></i>BOT</span>` 
            : '';

          // Attachments
          let attachmentsHtml = '';
          if (msg.attachments && msg.attachments.length > 0) {
            msg.attachments.forEach(att => {
              if (att.contentType && att.contentType.startsWith('image/')) {
                attachmentsHtml += `<div class="mt-2 max-w-sm rounded overflow-hidden border border-[#202225]">
                  <img src="${att.url}" alt="Attachment" class="max-h-60 w-auto object-cover">
                </div>`;
              } else {
                attachmentsHtml += `<div class="mt-2 flex items-center gap-2 bg-[#2b2d31] p-2 rounded max-w-xs border border-[#202225]">
                  <i class="fa-solid fa-file text-discord-blurple text-xl"></i>
                  <a href="${att.url}" target="_blank" rel="noopener noreferrer" class="text-xs text-discord-blurple hover:underline truncate">${att.filename || '添付ファイル'}</a>
                </div>`;
              }
            });
          }

          item.innerHTML = `
            ${avatarHtml}
            <div class="flex-1 overflow-hidden">
              <div class="flex items-center gap-1.5">
                <span class="font-semibold text-white text-sm">${msg.author.username}</span>
                ${botBadge}
                <span class="text-[11px] text-discord-muted ml-2">${msg.timestamp}</span>
              </div>
              <div class="text-sm text-discord-text leading-relaxed markdown-body mt-0.5">${renderMarkdown(msg.content)}</div>
              ${attachmentsHtml}
            </div>
          `;

          listContainer.appendChild(item);
        });

        if (forceScroll || isNearBottom) {
          container.scrollTop = container.scrollHeight;
        }
      }

      // Handle Message Send POST Request
      async function handleSendMessage(e) {
        e.preventDefault();
        if (state.isSending || !state.botToken || !state.channelId) return;

        const input = document.getElementById('messageInput');
        const content = input.value.trim();

        if (!content) return;

        state.isSending = true;
        const sendBtn = document.getElementById('sendBtn');
        sendBtn.disabled = true;
        sendBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xs"></i><span>送信中</span>`;

        try {
          const response = await fetch(`https://discord.com/api/v10/channels/${state.channelId}/messages`, {
            method: 'POST',
            headers: {
              'Authorization': `Bot ${state.botToken}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ content: content })
          });

          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.message || `HTTP ${response.status}`);
          }

          input.value = '';
          input.style.height = 'auto';
          showToast('メッセージを送信しました', 'success');

          // Immediately trigger fetch to show sent message
          await fetchMessages(true);
        } catch (err) {
          console.error('Send Message Error:', err);
          showToast(`送信エラー: ${err.message}`, 'error');
        } finally {
          state.isSending = false;
          sendBtn.disabled = false;
          sendBtn.innerHTML = `<span>送信</span><i class="fa-solid fa-paper-plane text-xs"></i>`;
        }
      }

      // Keydown listener for Enter key
      function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSendMessage(e);
        }
      }

      // Polling Loop Timer
      function startPolling() {
        if (state.pollingTimer) clearInterval(state.pollingTimer);
        state.pollingTimer = setInterval(() => {
          fetchMessages(false);
        }, state.pollingIntervalMs);
      }

      // Manual Refresh Helper
      function manualRefresh() {
        fetchMessages(true);
        showToast('ログを更新しました', 'info');
      }

      // Clear View
      function clearChatView() {
        document.getElementById('messagesList').innerHTML = '';
        showToast('表示ログを消去しました', 'info');
      }

      // Mobile Sidebar Toggle
      function toggleMobileSidebar() {
        const sidebar = document.querySelector('aside');
        sidebar.classList.toggle('hidden');
      }
    </script>
</body>
</html>
